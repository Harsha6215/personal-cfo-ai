name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_cfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/personal_cfo
      SECRET_KEY: ci-test-secret-key
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run linter (ruff)
        run: |
          pip install ruff
          ruff check backend/ --select E,F,W

      - name: Run type checker (mypy)
        run: |
          pip install mypy
          mypy backend/ --ignore-missing-imports --no-strict-optional || true

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint (ESLint)
        run: cd frontend && npm run lint || true

      - name: Type check
        run: cd frontend && npm run type-check || true

      - name: Build
        run: cd frontend && npm run build

  # ─── Docker ─────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t personal-cfo-backend .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t personal-cfo-frontend .

      - name: Build ai-services image
        run: docker build -f docker/ai-services.Dockerfile -t personal-cfo-ai-services .
